<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kubexis Cloud Platform</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; max-width: 500px; border: 1px solid #334155; }
    h1 { color: #38bdf8; margin-bottom: 0.5rem; }
    .badge { display: inline-block; background: #0284c7; color: white; padding: 4px 12px; border-radius: 9999px; font-size: 0.85rem; font-weight: bold; margin-bottom: 1rem; }
    .status-box { background: #0f172a; padding: 1rem; border-radius: 8px; text-align: left; font-family: monospace; font-size: 0.9rem; margin-top: 1rem; border: 1px solid #334155; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">Production Ready</span>
    <h1>Kubexis Cloud Suite</h1>
    <p>Multi-tier container architecture with automated backups, caching and secure reverse proxy.</p>
    <div class="status-box">
      <div>Backend API: <span style="color:#4ade80;">Operational</span></div>
      <div>PostgreSQL 16: <span style="color:#4ade80;">Healthy</span></div>
      <div>Redis Cache: <span style="color:#4ade80;">Connected</span></div>
      <div>Automated Backup: <span style="color:#38bdf8;">Scheduled (02:00 UTC)</span></div>
    </div>
  </div>
</body>
</html>
